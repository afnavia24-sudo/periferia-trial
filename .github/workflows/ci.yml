name: reto-01-registro-proveedor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificacion:
    # Sin ANTHROPIC_API_KEY: tests, typecheck y demo no llaman al modelo.
    runs-on: ubuntu-latest
    env:
      FECHA_EJECUCION: "2026-09-15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - run: npm run build:vercel
